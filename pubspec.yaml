name: bumi_wali
description: "Aplikasi Bumi Wali – Wisata Religi Ziarah Makam Wali di Kabupaten Tuban (Offline-First)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  google_maps_flutter: ^2.7.0
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3
  geolocator: ^12.0.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/database/bumi_wali_initial.db
    - assets/icons/
    - assets/images/branding/
    - assets/images/makam/
    - assets/images/ilustrasi/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.otf
          weight: 700
    - family: ArabicNaskh
      fonts:
        - asset: assets/fonts/Arabic/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arabic/NotoNaskhArabic-Bold.ttf
          weight: 700
